version: '3.8'

services:
  # ===================
  # Infrastructure
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: itsm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-network

  redis:
    image: redis:7-alpine
    container_name: itsm-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: itsm-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-itsm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-itsm_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - itsm-network

  # ===================
  # Backend Services
  # ===================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
      target: production
    container_name: itsm-gateway
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - INCIDENT_SERVICE_URL=http://incident-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
    depends_on:
      auth-service:
        condition: service_started
      incident-service:
        condition: service_started
    networks:
      - itsm-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: production
    container_name: itsm-auth-service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-itsm}:${POSTGRES_PASSWORD:-itsm_secret}@postgres:5432/${POSTGRES_DB:-itsm}?schema=auth
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - JWT_EXPIRES_IN=1d
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itsm-network

  incident-service:
    build:
      context: ./services/incident-service
      dockerfile: Dockerfile
      target: production
    container_name: itsm-incident-service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-itsm}:${POSTGRES_PASSWORD:-itsm_secret}@postgres:5432/${POSTGRES_DB:-itsm}?schema=incident
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-itsm}:${RABBITMQ_PASS:-itsm_secret}@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - itsm-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
      target: production
    container_name: itsm-notification-service
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3003
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-itsm}:${RABBITMQ_PASS:-itsm_secret}@rabbitmq:5672
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-noreply@example.com}
      - SMTP_PASS=${SMTP_PASS:-smtp_password}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - itsm-network

  # ===================
  # Frontend & Nginx
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: itsm-frontend
    restart: always
    networks:
      - itsm-network

  nginx:
    image: nginx:alpine
    container_name: itsm-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - frontend
    networks:
      - itsm-network

networks:
  itsm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
